name: Deploy to GitHub Pages

# Pages source = gh-pages / (root). Marketplace-free shell publish only.
# Avoids actions/checkout + upload-pages-artifact + deploy-pages download failures.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: /haodada
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          npm ci
          npm run build
          touch out/.nojekyll
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
